<template id="kwv-career-tpl-183637" data-kwv-form="1" data-kwv-closed="0"><div class="kwv-career-modal__job-inner" data-kwv-part="job"><header class="kwv-career-modal__header"><h2 id="kwv-career-modal-title" class="kwv-career-modal__title">[Placeholder] Brand Ambassador: Spirits</h2><p class="kwv-career-modal__ref">Ref: PH-BAS001</p><dl class="kwv-career-modal__meta"><div><dt>Location</dt><dd>Paarl, Western Cape</dd></div><div><dt>Department</dt><dd>Sales &amp; Marketing</dd></div><div><dt>Closing date</dt><dd>30 November 2026</dd></div></dl></header><div class="kwv-career-modal__content">

<p class="wp-block-paragraph">KWV is looking for an energetic Brand Ambassador to represent our spirits portfolio at trade and consumer events across the Western Cape.</p>
<h3 class="wp-block-heading">Key responsibilities</h3>
<ul class="wp-block-list">
<li>Host tastings and brand activations</li>
<li>Build relationships with on- and off-trade customers</li>
</ul>
<h3 class="wp-block-heading">Requirements</h3>
<ul class="wp-block-list">
<li>Relevant tertiary qualification</li>
<li>Valid driver’s licence and own transport</li>
</ul>
</div></div><div data-kwv-part="easy-apply"><div class="kwv-career-easy-apply"><a class="kwv-career-easy-apply__button" href="https://www.linkedin.com/jobs/view/0000000000/" target="_blank" rel="noopener noreferrer"><svg class="kwv-career-easy-apply__icon" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true" focusable="false"><path fill="currentColor" d="M20.45 20.45h-3.55v-5.57c0-1.33-.03-3.04-1.85-3.04-1.86 0-2.14 1.45-2.14 2.94v5.67H9.35V9h3.41v1.56h.05c.48-.9 1.64-1.85 3.37-1.85 3.6 0 4.27 2.37 4.27 5.46v6.28ZM5.34 7.43a2.06 2.06 0 1 1 0-4.13 2.06 2.06 0 0 1 0 4.13ZM7.12 20.45H3.56V9h3.56v11.45ZM22.23 0H1.77C.79 0 0 .77 0 1.73v20.54C0 23.23.79 24 1.77 24h20.45c.98 0 1.78-.77 1.78-1.73V1.73C24 .77 23.2 0 22.22 0h.01Z"></path></svg><span>Easy Apply with LinkedIn</span><span class="kwv-sr-only"> (opens in a new tab)</span></a><p class="kwv-career-easy-apply__or"><span>or apply with your CV below</span></p></div></div></template>
<template id="kwv-career-tpl-182320" data-kwv-form="1" data-kwv-closed="0"><div class="kwv-career-modal__job-inner" data-kwv-part="job"><header class="kwv-career-modal__header"><h2 id="kwv-career-modal-title" class="kwv-career-modal__title">Portfolio Brand Manager: Marketing Spirits</h2><p class="kwv-career-modal__ref">Ref: BMMS0128</p><dl class="kwv-career-modal__meta"><div><dt>Location</dt><dd>Paarl, Western Cape</dd></div><div><dt>Department</dt><dd>Marketing</dd></div><div><dt>Closing date</dt><dd>15 November 2026</dd></div></dl></header><div class="kwv-career-modal__content">
<p class="wp-block-paragraph"><strong>Purpose:</strong> To strategically develop and execute innovative brand plans that enhance consumer demand, deliver a superior commercial result, and elevate KWV’s premium spirits portfolio.</p>
<h3 class="wp-block-heading">Minimum requirements</h3>
<ul class="wp-block-list">
<li>A relevant tertiary qualification/degree in Marketing, Brand Management or a related field.</li>
<li>5–8 years’ experience in brand management within the FMCG industry (essential).</li>
<li>Proven experience managing FMCG brands (alcoholic beverage or premium brands advantageous).</li>
<li>Interest in spirits and enthusiasm to grow category knowledge (formal spirits education like WSET an advantage but not a requirement).</li>
<li>Strong commercial and financial acumen with hands-on experience managing brand P&amp;Ls, driving margin delivery, optimising COGS, and managing A&amp;P budgets.</li>
<li>Ability to generate actionable insights through analysis of data, market information and brand performance.</li>
<li>Valid driver’s licence and own reliable transport.</li>
<li>Willingness and ability to travel for business needs.</li>
</ul>
<h3 class="wp-block-heading">Skills and knowledge required</h3>
<ul class="wp-block-list">
<li>Creativity driven, with the ability to shape and progress brand ideas.</li>
<li>Brand (commercial and financial) acumen, linking brand performance to sales growth and sustainable margin delivery.</li>
<li>Confident navigating and interpreting performance dashboards and financial reports to drive decision-making.</li>
<li>Solid grasp of market, category and on- and off-trade dynamics, with the ability to recommend effective in-store activations and mechanics.</li>
<li>Proven ability to lead innovation projects from concept to launch, including developing a business case, pricing, packaging, and go-to-market planning.</li>
<li>Knowledge of social and digital media platforms, content performance metrics and best practices.</li>
<li>Consumer focused, with a strong interest in understanding evolving spirits consumption occasions and category trends.</li>
<li>Well organised and able to manage several priorities and deadlines independently, with strong time-management skills.</li>
<li>Willingness to learn, with a proactive approach and the confidence to make commitments.</li>
<li>Strong communication skills in English, both written and verbal.</li>
</ul>
<h3 class="wp-block-heading">Job outputs</h3>
<ul class="wp-block-list">
<li>Define brand objectives and lead the development and execution of consumer-focused brand plans for the spirits brands in your portfolio, translating these into clear communication, innovation and activation plans.</li>
<li>Contribute to the refinement and delivery of long-term portfolio strategy alongside the Marketing Executive.</li>
<li>Build and strengthen brand equity through clear, differentiated positioning and consistent execution across consumer touchpoints.</li>
<li>Contribute to the development and management of price, marketing, pack and portfolio ladders, and market-specific positioning.</li>
<li>Monitor and interpret consumer trends and perceptions to inform brand decisions.</li>
<li>Provide monthly internal reports on brand/category performance.</li>
<li>Track key competitors and measure performance (share, pricing, marketing activities, innovations) to identify opportunities.</li>
<li>Lead innovation projects from concept through to launch, ensuring commercial viability and brand alignment.</li>
<li>Oversee brand financials, including P&amp;L tracking, A&amp;P budget management, inventory planning, and COGS efficiency.</li>
<li>Analyse brand performance data to deliver actionable recommendations and achieve volume, revenue and profit targets.</li>
<li>Collaborate with customer marketing, local/international commercial teams and distributors to ensure focused activity and alignment on brand strategies.</li>
<li>Ensure effective management and evaluation of ROI on A&amp;P investment.</li>
</ul>
<p class="wp-block-paragraph"><strong>Preference will be given to suitably qualified candidates from under-represented groups aligned with our Employment Equity Plan.</strong></p>
<p class="wp-block-paragraph"><strong>Should you not hear from us within one month of the closing date of the advert, kindly regard your application to have been unsuccessful.</strong></p>
<p class="wp-block-paragraph">Please note that any personal information that you share with us will be used for the purposes of applying for a role with KWV as advertised above. This information may be shared with authorised KWV representatives (internal and contracted external parties) as required. Should you have any questions related to how we process your personal information, please refer to the privacy policy.</p>
</div></div><div data-kwv-part="easy-apply"></div></template>
